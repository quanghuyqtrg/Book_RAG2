    ##  test: ["CMD-SHELL", "curl -fsS http://localhost:8000/ || exit 1"]
    ##  interval: 10s
   ##   timeout: 5s
    ##  retries: 30

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
  #  healthcheck:
   #   test: ["CMD", "wget", "-qO-", "http://localhost:6333/healthz"]
     # interval: 5s
      #timeout: 3s
    #retries: 20

  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: husky
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  qdrant_storage:
  pg_data:
